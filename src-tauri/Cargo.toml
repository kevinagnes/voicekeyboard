[package]
name = "voicekeyboard"
version = "1.0.9"
description = "Local, offline-first push-to-talk dictation app"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.8"
cpal = "0.15"
enigo = "0.2"
arboard = "3"
rodio = "0.19"
anyhow = "1"
thiserror = "2"
directories = "6"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
futures-util = "0.3"
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
macos-accessibility-client = "0.0"
accessibility = "0.2"
objc2-app-kit = "0.3"
objc2-av-foundation = "0.3"
objc2-user-notifications = "0.3"
objc2-foundation = "0.3"
objc2 = "0.6"
block2 = "0.6"
core-foundation = "0.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[profile.release]
lto = true
codegen-units = 1
strip = true
