<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask Gemini</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #panel {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 14px 16px 12px;
        border-radius: 16px;
        background: rgba(16, 18, 22, 0.82);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.92);
        box-sizing: border-box;
      }
      #header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: rgba(255, 255, 255, 0.9);
      }
      #dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff3b30;
      }
      #phase {
        color: rgba(255, 255, 255, 0.55);
        font-weight: 500;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #sessionTitle {
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.45);
      }
      #newSessionBtn {
        display: none;
        padding: 4px 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        background: rgba(79, 140, 255, 0.16);
        color: rgba(255, 255, 255, 0.9);
        font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      #newSessionBtn:hover {
        background: rgba(79, 140, 255, 0.32);
      }
      #newSessionBtn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #history {
        display: none;
        flex-direction: column;
        gap: 4px;
        flex: 0 1 auto;
        min-height: 0;
        max-height: 55%;
        overflow-y: auto;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      #panel > .row {
        flex-shrink: 0;
      }
      .hist-row {
        display: flex;
        gap: 8px;
        font-size: 12px;
        line-height: 1.4;
      }
      .hist-who {
        min-width: 46px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.35);
        padding-top: 1px;
      }
      .hist-row.you .hist-who {
        color: rgba(122, 200, 255, 0.7);
      }
      .hist-row.gemini .hist-who {
        color: rgba(179, 146, 240, 0.7);
      }
      .hist-text {
        flex: 1;
        color: rgba(255, 255, 255, 0.65);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 54px;
        overflow: hidden;
      }
      #historyMore {
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.35);
        padding: 2px 0 2px 54px;
      }
      #cancelBtn {
        display: none;
        padding: 4px 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        background: rgba(255, 59, 48, 0.18);
        color: rgba(255, 255, 255, 0.9);
        font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      #cancelBtn:hover {
        background: rgba(255, 59, 48, 0.35);
      }
      #levelbar {
        height: 4px;
        width: 120px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      #dragHandle {
        cursor: grab;
        color: rgba(255, 255, 255, 0.4);
        font-size: 15px;
        line-height: 1;
        padding: 0 3px;
        letter-spacing: -1px;
      }
      #dragHandle:active {
        cursor: grabbing;
      }
      #historyToggle {
        display: none;
        padding: 2px 9px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        color: rgba(255, 255, 255, 0.62);
        font: 600 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      #historyToggle:hover {
        background: rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.9);
      }
      #historyToggle.on {
        background: rgba(79, 140, 255, 0.25);
        border-color: rgba(79, 140, 255, 0.5);
        color: #fff;
      }
      #shotChip {
        display: none;
        margin: 0 0 8px;
        padding: 4px 10px;
        border-radius: 8px;
        background: rgba(52, 199, 89, 0.12);
        border: 1px solid rgba(52, 199, 89, 0.3);
        color: rgba(210, 255, 220, 0.9);
        font-size: 11.5px;
        font-weight: 600;
        width: fit-content;
      }
      #transcript,
      #reply {
        cursor: pointer;
      }
      #levelfill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, #4f8cff, #7ac8ff);
        transition: width 80ms linear;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .who {
        min-width: 58px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        padding-top: 2px;
      }
      .text {
        flex: 1;
        min-height: 16px;
        font-size: 13.5px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.95);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 120px;
        overflow-y: auto;
      }
      .text.placeholder {
        color: rgba(255, 255, 255, 0.35);
      }
      .who.you {
        color: #7ac8ff;
      }
      .who.gemini {
        color: #b392f0;
      }
      #error {
        display: none;
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 59, 48, 0.12);
        border: 1px solid rgba(255, 59, 48, 0.35);
        color: #ff8a80;
        font-size: 12.5px;
        line-height: 1.4;
      }
      .thinking-dots {
        color: rgba(255, 255, 255, 0.5);
        font-weight: 600;
      }
      .thinking-dots::after {
        content: "";
        animation: dots 1.4s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75%,
        100% {
          content: "...";
        }
      }
      #speaking {
        display: none;
        margin-top: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: rgba(255, 255, 255, 0.4);
      }
      #speaking::before {
        content: "● ";
        color: #34c759;
        animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      #sources {
        display: none;
        margin-top: 8px;
        font-size: 11px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.45);
      }
      #sources .source {
        display: inline-block;
        margin-right: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }
      #plan,
      #tool,
      #artifacts {
        display: none;
        margin-top: 7px;
        font-size: 11.5px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.55);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #plan b,
      #tool b,
      #artifacts b {
        color: rgba(255, 255, 255, 0.8);
        font-weight: 600;
      }
      #permission {
        display: none;
        position: absolute;
        inset: 10px;
        z-index: 20;
        flex-direction: column;
        gap: 8px;
        padding: 14px;
        border-radius: 12px;
        background: rgba(24, 27, 33, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
      }
      #permission h3 {
        margin: 0;
        font-size: 14px;
      }
      #permissionDetail {
        flex: 1;
        overflow-y: auto;
        font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        color: rgba(255, 255, 255, 0.72);
      }
      #permissionButtons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #permissionButtons button {
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
        font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #permissionButtons button.primary {
        background: #2563eb;
        border-color: #2563eb;
      }
      #permissionButtons button.danger {
        background: rgba(255, 59, 48, 0.2);
        border-color: rgba(255, 59, 48, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="panel" data-tauri-drag-region="deep">
      <div id="header">
        <span id="dragHandle" data-tauri-drag-region title="Drag to move">⠿</span>
        <div id="dot" data-tauri-drag-region></div>
        <span data-tauri-drag-region>Ask Gemini</span>
        <span id="sessionTitle" data-tauri-drag-region></span>
        <button id="historyToggle">History</button>
        <span id="phase" data-tauri-drag-region>Listening…</span>
        <button id="newSessionBtn">+ New session</button>
        <button id="cancelBtn">✕ Cancel</button>
        <div id="levelbar"><div id="levelfill"></div></div>
      </div>
      <div id="history" data-tauri-drag-region="false"></div>
      <div id="shotChip" data-tauri-drag-region="false">📷 Screenshot attached — ask about it</div>
      <div class="row">
        <span class="who you">You</span>
        <div id="transcript" class="text placeholder" data-tauri-drag-region="false" title="Click to expand session history">…</div>
      </div>
      <div class="row">
        <span class="who gemini">Gemini</span>
        <div id="reply" class="text placeholder" data-tauri-drag-region="false" title="Click to expand session history">…</div>
      </div>
      <div id="speaking">Speaking reply</div>
      <div id="plan"></div>
      <div id="tool"></div>
      <div id="artifacts"></div>
      <div id="sources"></div>
      <div id="error"></div>
      <div id="permission" data-tauri-drag-region="false">
        <h3 id="permissionTitle">Permission</h3>
        <div id="permissionDetail"></div>
        <div id="permissionButtons"></div>
      </div>
    </div>
    <script src="llm.js"></script>
  </body>
</html>
