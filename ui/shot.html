<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenshot</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #shade {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 14, 0.28);
      }
      #selection {
        position: fixed;
        display: none;
        border: 2px solid #5b9dff;
        background: rgba(91, 157, 255, 0.08);
        box-shadow: 0 0 0 9999px rgba(8, 10, 14, 0.28);
        border-radius: 2px;
      }
      #hint {
        position: fixed;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(16, 18, 22, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.9);
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.2px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="shade"></div>
    <div id="selection"></div>
    <div id="hint">Drag a region · Esc to cancel</div>
    <script src="shot.js"></script>
  </body>
</html>
